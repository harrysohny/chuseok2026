<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2026 행복한 한가위 · 손형락 드림</title>
<meta name="theme-color" content="#f7f0e3">
<style>
:root{--cream:#f7f0e3;--ink:#26364d;--gold:#edc268;--orange:#df7d3b;--blue1:#6d7d91;--blue2:#354a66}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#eee7da;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink)}
body{overflow-x:hidden}.wrap{min-height:100svh;display:grid;place-items:center;padding:14px}
.card{position:relative;width:min(430px,100%);height:min(820px,calc(100svh - 28px));min-height:680px;overflow:hidden;border-radius:30px;background:var(--cream);box-shadow:0 20px 60px #2732462c}
.moon{position:absolute;width:190px;height:190px;border-radius:50%;right:18px;top:180px;background:radial-gradient(circle at 35% 30%,#f8d98a,#efbf59);box-shadow:0 0 40px #efbf5960;animation:moon 5s ease-in-out infinite}
@keyframes moon{50%{transform:scale(1.025);box-shadow:0 0 60px #efbf5980}}
.branch{position:absolute;right:-30px;top:25px;width:230px;height:100px;border-top:7px solid #4d493e;border-radius:55%;transform:rotate(-9deg)}
.fruit{position:absolute;width:40px;height:36px;border-radius:45%;background:var(--orange);top:65px;box-shadow:inset 0 4px #f09b55}.f1{right:78px}.f2{right:23px;top:82px}
.leaf{position:absolute;width:13px;height:28px;background:#d89a3d;border-radius:90% 0 90% 0;z-index:2;animation:fall 7s ease-in-out infinite}.l1{top:350px;left:70%}.l2{top:410px;left:57%;animation-delay:-2.5s}.l3{top:460px;left:83%;animation-delay:-4.5s}
@keyframes fall{50%{transform:translate(16px,28px) rotate(120deg)}100%{transform:translate(-5px,58px) rotate(230deg)}}
.hill{position:absolute;width:570px;height:250px;border-radius:50% 50% 0 0;bottom:105px;left:-170px;background:var(--blue1);transform:rotate(8deg)}.hill.b{left:120px;bottom:78px;background:var(--blue2);transform:rotate(-8deg)}
.river{position:absolute;left:0;right:0;bottom:0;height:190px;background:#fbf4e9;clip-path:polygon(0 37%,38% 16%,67% 31%,43% 49%,82% 65%,100% 100%,0 100%)}
.content{position:relative;z-index:3;padding:50px 34px}.year{font:24px Georgia,serif;letter-spacing:7px}h1{font-family:Georgia,"Nanum Myeongjo","Apple SD Gothic Neo",serif;font-size:50px;font-weight:500;line-height:1.08;margin:22px 0 18px}.intro{font-size:19px;line-height:1.75}
.open{position:absolute;z-index:6;left:12%;bottom:44px;width:76%;padding:17px 12px;border:1px solid #fff;border-radius:999px;background:#fff9;backdrop-filter:blur(8px);box-shadow:0 8px 28px #765d3028;color:#51432e;font-size:17px;cursor:pointer}
.open:active,.close:active{transform:scale(.98)}
.message{position:absolute;z-index:20;inset:0;display:grid;place-items:center;padding:32px;background:#f8f1e6f7;opacity:0;visibility:hidden;pointer-events:none;transition:.38s ease}
.message.show{opacity:1;visibility:visible;pointer-events:auto}.paper{text-align:center;max-width:345px;transform:translateY(20px);transition:.38s ease}.show .paper{transform:none}
.to{font-size:21px;margin-bottom:27px}.msg{font-family:Georgia,"Nanum Myeongjo","Apple SD Gothic Neo",serif;font-size:19px;line-height:2;word-break:keep-all}.from{margin-top:30px;font-size:18px;font-weight:600}.close{margin-top:30px;border:0;border-radius:999px;background:var(--blue2);color:#fff;padding:12px 24px;font-size:15px;cursor:pointer}
.admin{position:fixed;right:10px;bottom:8px;font-size:10px;color:#0000;user-select:none}
@media(max-height:720px){.card{min-height:640px}.content{padding-top:35px}h1{font-size:43px}.moon{width:160px;height:160px;top:150px}.open{bottom:28px}}
</style></head>
<body>
<div class="wrap"><main class="card">
<div class="moon"></div><div class="branch"></div><i class="fruit f1"></i><i class="fruit f2"></i>
<i class="leaf l1"></i><i class="leaf l2"></i><i class="leaf l3"></i><div class="hill"></div><div class="hill b"></div><div class="river"></div>
<section class="content"><div class="year">2026</div><h1>행복한<br>한가위</h1><div class="intro">한가위를 맞아<br>가족과 즐거운 시간<br>되시길 바랍니다.</div></section>
<button class="open" id="openBtn">인사말을 열어보세요</button>
<section class="message" id="message" aria-hidden="true"><div class="paper"><div class="to" id="recipient"></div><div class="msg" id="msg"></div><div class="from">손형락 드림</div><button class="close" id="closeBtn">카드로 돌아가기</button></div></section>
</main></div>
<script>
const q=new URLSearchParams(location.search);
const name=(q.get('name')||'').trim();
const type=(q.get('type')||'basic').trim();
const messages={
 basic:'한가위를 맞아 가족과 함께<br>즐겁고 따뜻한 시간 보내시길 바랍니다.<br>늘 건강과 행복이 함께하시고,<br>풍성하고 평안한 명절 되십시오.',
 business:'한가위를 맞아 가족과 함께<br>즐겁고 따뜻한 시간 보내시길 바랍니다.<br>늘 보내주시는 성원에 감사드리며,<br>건강과 행복이 가득한 풍성한 명절 되십시오.',
 church:'풍성한 한가위를 맞아<br>가정에 사랑과 평안이 가득하시길 기원합니다.<br>가족과 함께 따뜻하고 감사가 넘치는<br>명절 보내십시오.',
 friend:'한가위를 맞아 가족과 함께<br>즐겁고 행복한 시간 보내시길 바랍니다.<br>건강하고 넉넉한 웃음이 가득한<br>추석 되세요.'
};
document.getElementById('recipient').textContent=name ? name+'님께' : '소중한 분께';
document.getElementById('msg').innerHTML=messages[type]||messages.basic;
const modal=document.getElementById('message');
document.getElementById('openBtn').onclick=()=>{modal.classList.add('show');modal.setAttribute('aria-hidden','false')};
document.getElementById('closeBtn').onclick=()=>{modal.classList.remove('show');modal.setAttribute('aria-hidden','true')};
</script></body></html>
